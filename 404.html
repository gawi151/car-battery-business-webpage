<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Nie znaleziono strony - Akumulatory Katowice</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1e3a8a;
            color: #111827;
            font-family: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        main {
            width: min(100%, 48rem);
            padding: clamp(1.5rem, 5vw, 2.5rem);
            text-align: center;
            background-color: #fff;
            border-top: 0.25rem solid #facc15;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .brand {
            margin: 0 0 0.75rem;
            color: #1e3a8a;
            font-size: 1rem;
            font-weight: 700;
        }

        h1 {
            margin: 0;
            color: #1e3a8a;
            font-size: clamp(2rem, 8vw, 3rem);
            line-height: 1.1;
        }

        p {
            margin: 1rem 0 0;
            font-size: 1.125rem;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            align-items: center;
            margin-top: 1.5rem;
        }

        a {
            color: #1e3a8a;
            font-weight: 700;
            text-underline-offset: 2px;
        }

        a:focus-visible {
            outline: 3px solid #facc15;
            outline-offset: 3px;
        }

        .button {
            display: inline-flex;
            min-height: 2.75rem;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.25rem;
            border-radius: 0.25rem;
            background-color: #eab308;
            color: #1e3a8a;
            line-height: 1.2;
            text-align: center;
            text-decoration: none;
        }

        .button:hover,
        .button:focus-visible {
            background-color: #facc15;
        }

        .secondary-link {
            display: inline-flex;
            min-height: 2.75rem;
            align-items: center;
            justify-content: center;
            padding: 0.6875rem 1rem;
            border: 1px solid #94a3b8;
            border-radius: 0.25rem;
            background-color: #fff;
            color: #1e3a8a;
            line-height: 1.2;
            text-align: center;
            text-decoration: none;
        }

        .secondary-link:hover,
        .secondary-link:focus-visible {
            border-color: #eab308;
            background-color: #f8fafc;
        }

        .legal-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #374151;
            font-size: 0.9375rem;
            font-weight: 600;
        }

        @media (max-width: 40rem) {
            .actions {
                display: grid;
                grid-template-columns: 1fr;
            }

            .button,
            .secondary-link {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main>
        <p class="brand">Akumulatory Katowice</p>
        <h1>Nie znaleziono strony</h1>
        <p>Strona, której szukasz, nie istnieje albo została przeniesiona. Możesz zadzwonić albo wrócić na stronę główną.</p>
        <nav class="actions" aria-label="Najważniejsze linki">
            <a class="button" href="tel:+48501436661">Zadzwoń:&nbsp;501&nbsp;436&nbsp;661</a>
            <a class="secondary-link" href="/">Wróć na stronę główną</a>
        </nav>
        <a class="legal-link" href="/privacy-policy.html">Polityka prywatności</a>
    </main>
</body>

</html>
