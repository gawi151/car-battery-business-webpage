<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Nie znaleziono strony - Akumulatory Katowice</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f3f4f6;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        main {
            width: min(100% - 2rem, 42rem);
            padding: 2rem;
            text-align: center;
            background-color: #fff;
            border-top: 0.25rem solid #facc15;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        h1 {
            margin: 0;
            color: #1e3a8a;
            font-size: clamp(2rem, 8vw, 3rem);
            line-height: 1.1;
        }

        p {
            margin: 1rem 0 0;
            font-size: 1.125rem;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        a {
            color: #1e3a8a;
            font-weight: 700;
            text-underline-offset: 2px;
        }

        .button {
            display: inline-block;
            padding: 0.75rem 1.25rem;
            border-radius: 0.25rem;
            background-color: #eab308;
            color: #1e3a8a;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main>
        <h1>Nie znaleziono strony</h1>
        <p>Strona, której szukasz, nie istnieje albo została przeniesiona.</p>
        <nav class="actions" aria-label="Przydatne linki">
            <a class="button" href="/">Wróć na stronę główną</a>
            <a href="/#kontakt">Kontakt i mapa</a>
            <a href="tel:+48501436661">Zadzwoń:&nbsp;501&nbsp;436&nbsp;661</a>
        </nav>
    </main>
</body>

</html>
